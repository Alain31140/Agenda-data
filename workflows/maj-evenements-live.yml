name: Mise à jour événements live

on:
  workflow_dispatch:

  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

jobs:
  mise-a-jour:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Générer evenements-live.json
        run: node scripts/maj-evenements-live.js

      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add json/evenements-live.json

          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Mise à jour automatique des événements live"
            git push
          fi